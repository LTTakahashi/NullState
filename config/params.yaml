# Reference HVG selection (run_training_pipeline, before SCVI). 'seurat_v3' is the
# count-based flavor and requires raw counts (the harmonized reference has them).
# For the Phase 2 cross-germ-layer reference, raise n_hvg and/or move to a batch-aware
# HVG so the gene panel is not biased toward the neural reference.
n_hvg: 4000
hvg_flavor: seurat_v3

# scANVI / scArches
n_latent: 30
# Batch key for SCVI/SCANVI integration across the two source atlases.
# The reference combines HDBCA (10x, single-cell, neural) with Cao fetal
# (sci-RNA-seq3, single-nucleus, non-neural anchors), so germ layer is confounded
# with assay/suspension/atlas. 'donor_id' (54 levels, nested within atlas/assay)
# removes nuisance technical variation without explicitly collapsing the
# neural-vs-non-neural axis. Set to null to disable integration (NOT recommended).
batch_key: donor_id
# scArches surgery epochs. Set to 0 = stable pure reference projection (the original
# validated approach). >0 enables query fine-tuning but is numerically UNSTABLE on this
# query because HNOCA lacks true raw UMI counts (only log-norm + length-normalized),
# so the reference ZINB likelihood is mis-specified during surgery and diverges to NaN.
# Re-enable (e.g. 100) once true raw UMI counts are sourced for the query (Phase 1).
scarches_max_epochs: 0
# Drop query cells with fewer than this many counts across the reference HVGs.
# The query expresses these HVGs sparsely (median ~190); near-empty cells cause
# scArches encoder NaN divergence and are uninformative for label transfer.
query_min_hvg_counts: 50
scarches_weight_decay: 0.0
scvi_max_epochs: 400
scanvi_max_epochs: 200
# scANVI hardening (Phase 1 / WS0b): stop on the validation plateau instead of always
# running the full scanvi_max_epochs, which the pilot showed over-trains the classifier
# (validation ELBO degraded ~15 past its minimum, hurting rare-type label reliability).
# Mirrors the early-stopping already used for scArches surgery. Only affects a fresh
# retrain; models loaded from disk are unaffected. Set false to reproduce the original run.
scanvi_early_stopping: true
scanvi_early_stopping_patience: 15

# Off-target classification thresholds (data-derived)
tau_H_percentile: 95  # mapping entropy threshold
tau_R_percentile: 99  # off-manifold distance threshold
k_neighbors_offmanifold: 15
ref_holdout_fraction: 0.10
# Organoid germ-layer system under analysis. Selects the on-target origin set in
# src/mapping/classify.py (neural -> {neural, neural_crest} on-target; mesoderm -> kidney;
# endoderm -> HEOCA). The neural pilot uses 'neural'; the other values reuse the same
# classifier unchanged for the Phase 2 cross-germ-layer expansion.
expected_germ_layer: neural
# Empirical (non-uniform) label prior for scANVI predictions (Phase 1 / WS0b).
# When true, soft predictions are reweighted by the reference class frequencies and
# renormalized (logit-adjustment prior correction) before entropy/argmax, in BOTH
# threshold calibration and query scoring, so rare types are not over-predicted.
# Default false preserves the validated uniform-prior pilot behavior; enabling it
# shifts the calibrated tau_H and the class distribution, so re-validate after a run.
empirical_label_prior: false

# contrastiveVI dish-stripping (Aim 2 / Phase 1 WS1) -- the PRIMARY disentanglement
# (see docs/aim2_method_reconciliation.md). background = primary on-target, target =
# organoid on-target; background (shared) latent = z_lin (lineage, used by Aim 3 geometry),
# salient latent = z_iv (in-vitro signature). Gate B was GO, so a single shared z_iv is used.
# SCAFFOLD: src/disentangle/contrastive.py is not yet run (needs scvi-tools + GPU + data).
contrastive_n_background_latent: 15   # z_lin dims (the 15-30 band the Aim-3 geometry expects)
contrastive_n_salient_latent: 10      # z_iv dims
contrastive_max_epochs: 200
contrastive_early_stopping: true
contrastive_early_stopping_patience: 15

# Dish-vector test (Step 3)
cosine_go_threshold: 0.70

# Count gates (Step 4)
count_green_total: 1000
count_green_per_protocol: 300
count_yellow_total: 300

# Mesenchymal regex pattern for label matching
mesenchymal_pattern: "mesench|stroma|fibro"

# Aim 3 geometry (WS2): dimension-robust OT on z_lin, read ONLY against the matched-N
# self-distance floor (research_strategy_feasibility_power.md §3-§7). Consumed by src/geometry/.
rarefaction_ladder: [50, 100, 200, 500, 1000, 2000, 5000]   # N-ladder for empirical N_min
geometry_n_projections: 200        # sliced-Wasserstein random projections
geometry_sinkhorn_eps_scale: 0.1   # debiased-Sinkhorn eps as a fraction of median pairwise cost
geometry_n_self_repeats: 200       # disjoint split-half reps for the self-distance floor
geometry_n_boot: 1000              # bootstrap reps for the cross-distance CI
geometry_floor_quantile: 95        # self-distance floor quantile a real difference must clear
geometry_n_permutations: 0         # permutation reps for cross-pair p-values (0 = CI-vs-floor only)
# Persistent homology (topology.py): H0 confirmatory (pure MST + Fasy bootstrap band); H1 is
# exploratory only and needs the optional 'ripser' package.
topology_alpha: 0.05               # Fasy confidence-band level
topology_n_bootstrap: 1000         # bootstrap reps for the H0 confidence band

# Interpretation (WS3): post-processing of CellOracle shift scores + program scores (src/interpret/).
ws3_alpha: 0.05                    # FDR level for perturbation-target and program-score ranking

# Dish-vector: max cells per type when computing per-type means (memory cap)
dish_max_cells_per_type: 3000
