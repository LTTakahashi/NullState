data_dir: data/
results_dir: results/pilot/

datasets:
  hnoca:
    name: "Human Neural Organoid Cell Atlas"
    cellxgene_collection_id: "de379e5f-52d0-498c-9801-0f850823c847"
    # CANONICAL QUERY = the CELLxGENE copy (dataset "The Human Neural Organoid Atlas").
    # It carries genuine integer raw UMI counts in raw.X and Ensembl var_names, which the
    # Zenodo hnoca_cleanedmeta.h5ad lacked (log-norm + length-norm only) -- that gap forced
    # the pilot to 0-epoch projection. Fetch with scripts/fetch_verify_cellxgene.py.
    zenodo_url: "https://zenodo.org/records/14161275/files/hnoca_cleanedmeta.h5ad"  # legacy; NOT used
    local_path: data/hnoca_cellxgene.h5ad
    paper: "He, Fleck et al. Nature 2024"
  hdbca:
    name: "Human Developmental Brain Cell Atlas"
    cellxgene_collection_id: "4d8fed08-2d6d-4692-b5ea-464f1d072077"
    local_path: data/hdbca.h5ad
    paper: "Braun et al. Science 2023"
  cao_fetal:
    name: "Human Fetal Cell Atlas"
    cellxgene_collection_id: "c114c20f-1ef4-49a5-9c2e-d965787fb90c"
    local_path: data/cao_fetal.h5ad
    paper: "Cao et al. Science 2020"

  # --- Phase 2 (cross-germ-layer expansion): NOT YET SOURCED. ---
  # Structure/placeholders only so the data contract is explicit. Fill the
  # collection IDs / paths during WS0a sourcing. IDs are deliberately left as TODO
  # (do not guess them -- the wrong atlas silently changes which cells enter the
  # analysis). 'germ_layer' maps to params.expected_germ_layer for that system.
  heoca:
    name: "Human Endoderm Organoid Cell Atlas"
    germ_layer: endoderm
    cellxgene_collection_id: "b4d13dc2-9b75-401d-9d9a-6d1468c17d90"  # confirmed; ships raw+norm counts
    local_path: data/heoca.h5ad
    paper: "Xu et al. Nat Genet 2025 (10.1038/s41588-025-02182-6)"
    status: phase2_id_confirmed
  kidney_organoid:
    name: "Kidney organoid benchmark (mesoderm)"
    germ_layer: mesoderm
    # No single CZI germ-layer atlas exists for kidney/mesoderm -- assemble from benchmarks.
    # Seed: Subramanian et al. Nat Commun 2019 (450k cells, off-target-aware) via GEO / Broad SCP211.
    cellxgene_collection_id: "TODO"        # no single collection; see docs/ws0a_data_sourcing.md
    local_path: data/kidney_organoid.h5ad
    paper: "Subramanian et al. Nat Commun 2019 (10.1038/s41467-019-13382-0)"
    status: phase2_assembly_needed

outputs:
  reference: results/pilot/reference.h5ad
  schemas: results/pilot/schemas/
  model: results/pilot/reference_model/
  classifications: results/pilot/classifications/
  dish_vectors: results/pilot/dish_vectors/
  gates: results/pilot/gates/
  thresholds: results/pilot/thresholds.json
