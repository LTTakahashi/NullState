name: nullstate
channels:
  - conda-forge
  - defaults
dependencies:
  # python 3.10 + scvi-tools 1.3.3 is the validated stack (the ContrastiveVI train/
  # get_latent_representation API and the scANVI/scArches trainer_kwargs only hold in 1.3.3;
  # 1.4.x needs python>=3.11 and changes those signatures). Do NOT loosen these two pins.
  - python=3.10
  - scanpy>=1.10
  - anndata>=0.10
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scvi-tools=1.3.3
  - scikit-misc  # scanpy seurat_v3 (count-based) HVG flavor
  - pytorch>=2.0
  - leidenalg
  - igraph
  - louvain
  - pyyaml
  - rich
  - tqdm
  - jsonschema
  - pytest
  - pytest-cov
  - requests
  - pip
  - tiledbsoma>=1.15.3
  - pip:
    - cellxgene-census==1.17.*
    - gseapy
    - decoupler
    - obonet
    - pronto
